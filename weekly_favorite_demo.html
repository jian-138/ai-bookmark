<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周报收藏与关键词搜索</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        .content {
            padding: 30px;
        }
        
        .search-section {
            margin-bottom: 30px;
        }
        
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .search-input {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .keyword-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }
        
        .keyword-tag {
            padding: 8px 16px;
            background: #f0f0f0;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9em;
        }
        
        .keyword-tag:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }
        
        .results-section {
            margin-top: 30px;
        }
        
        .result-card {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .result-card:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .result-card h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.2em;
        }
        
        .result-card p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        
        .result-meta {
            display: flex;
            gap: 15px;
            font-size: 0.85em;
            color: #999;
        }
        
        .match-type {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
        }
        
        .match-exact {
            background: #d4edda;
            color: #155724;
        }
        
        .match-fuzzy {
            background: #fff3cd;
            color: #856404;
        }
        
        .match-text {
            background: #d1ecf1;
            color: #0c5460;
        }
        
        .stats-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }
        
        .stat-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            color: #666;
            margin-top: 5px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #f5c6cb;
        }
        
        .favorite-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .btn-small {
            padding: 6px 12px;
            font-size: 0.85em;
        }
        
        .btn-favorite {
            background: #28a745;
        }
        
        .btn-remove {
            background: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 周报收藏与关键词搜索</h1>
            <p>智能管理您的收藏内容，快速定位重要信息</p>
        </div>
        
        <div class="content">
            <!-- 统计信息 -->
            <div class="stats-section">
                <h2>📊 数据统计</h2>
                <div class="stats-grid" id="statsGrid">
                    <div class="stat-card">
                        <div class="stat-number" id="totalKeywords">0</div>
                        <div class="stat-label">总关键词数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="totalCollections">0</div>
                        <div class="stat-label">收藏内容数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="totalFavorites">0</div>
                        <div class="stat-label">周报收藏数</div>
                    </div>
                </div>
            </div>
            
            <!-- 搜索区域 -->
            <div class="search-section">
                <h2>🔍 关键词搜索</h2>
                <div class="search-box">
                    <input type="text" class="search-input" id="searchInput" 
                           placeholder="输入关键词进行搜索...">
                    <button class="btn" onclick="searchKeyword()">搜索</button>
                    <button class="btn" onclick="getAllKeywords()">获取所有关键词</button>
                </div>
                
                <div id="keywordCloud" class="keyword-cloud"></div>
            </div>
            
            <!-- 搜索结果显示 -->
            <div class="results-section" id="resultsSection" style="display: none;">
                <h2>📋 搜索结果</h2>
                <div id="searchResults"></div>
            </div>
            
            <!-- 加载提示 -->
            <div class="loading" id="loading" style="display: none;">
                <div class="spinner"></div>
                <p>加载中...</p>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE_URL = 'http://localhost:8000';
        let currentUserId = 'user_123'; // 示例用户 ID，实际应从登录信息获取
        
        // 页面加载时获取统计数据
        document.addEventListener('DOMContentLoaded', () => {
            loadStatistics();
            getAllKeywords();
        });
        
        // 加载统计数据
        async function loadStatistics() {
            try {
                const response = await fetch(
                    `${API_BASE_URL}/api/v1/weekly/keywords/statistics?user_id=${currentUserId}`
                );
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('totalKeywords').textContent = data.data.total_keywords || 0;
                    document.getElementById('totalCollections').textContent = data.data.total_collections || 0;
                }
            } catch (error) {
                console.error('加载统计数据失败:', error);
            }
        }
        
        // 获取所有关键词
        async function getAllKeywords() {
            showLoading(true);
            try {
                const response = await fetch(
                    `${API_BASE_URL}/api/v1/weekly/keywords?user_id=${currentUserId}`
                );
                const data = await response.json();
                
                if (data.success) {
                    displayKeywordCloud(data.keywords);
                }
            } catch (error) {
                console.error('获取关键词失败:', error);
                showError('获取关键词失败');
            } finally {
                showLoading(false);
            }
        }
        
        // 显示关键词云
        function displayKeywordCloud(keywords) {
            const cloud = document.getElementById('keywordCloud');
            cloud.innerHTML = '';
            
            if (keywords.length === 0) {
                cloud.innerHTML = '<p style="color: #999;">暂无关键词</p>';
                return;
            }
            
            keywords.forEach(keyword => {
                const tag = document.createElement('span');
                tag.className = 'keyword-tag';
                tag.textContent = keyword;
                tag.onclick = () => searchByKeyword(keyword);
                cloud.appendChild(tag);
            });
        }
        
        // 按关键词搜索
        function searchByKeyword(keyword) {
            document.getElementById('searchInput').value = keyword;
            searchKeyword();
        }
        
        // 搜索关键词
        async function searchKeyword() {
            const keyword = document.getElementById('searchInput').value.trim();
            if (!keyword) {
                alert('请输入搜索关键词');
                return;
            }
            
            showLoading(true);
            
            try {
                const response = await fetch(
                    `${API_BASE_URL}/api/v1/weekly/keywords/search`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            user_id: currentUserId,
                            keyword: keyword,
                            exact_match: false,
                            favorites_only: false,
                            page: 1,
                            page_size: 20
                        })
                    }
                );
                
                const data = await response.json();
                
                if (data.success) {
                    displaySearchResults(data);
                } else {
                    showError('搜索失败');
                }
            } catch (error) {
                console.error('搜索失败:', error);
                showError('搜索失败，请稍后重试');
            } finally {
                showLoading(false);
            }
        }
        
        // 显示搜索结果
        function displaySearchResults(results) {
            const section = document.getElementById('resultsSection');
            const container = document.getElementById('searchResults');
            
            section.style.display = 'block';
            container.innerHTML = '';
            
            if (results.items.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #999; padding: 40px;">未找到相关内容</p>';
                return;
            }
            
            results.items.forEach(item => {
                const card = createResultCard(item);
                container.appendChild(card);
            });
            
            // 更新统计
            document.getElementById('totalCollections').textContent = results.total;
        }
        
        // 创建结果卡片
        function createResultCard(item) {
            const card = document.createElement('div');
            card.className = 'result-card';
            
            const collection = item.collection;
            const matchType = item.match_type || 'exact';
            
            card.innerHTML = `
                <h3>${collection.keywords?.[0] || '未分类内容'}</h3>
                <p>${collection.original_text?.substring(0, 200) || '无内容'}...</p>
                <div class="result-meta">
                    <span class="match-type match-${matchType}">
                        ${getMatchTypeText(matchType)}
                    </span>
                    <span>📅 ${formatDate(collection.created_at)}</span>
                    <span>🏷️ ${collection.keywords?.join(', ') || '无关键词'}</span>
                </div>
                <div class="favorite-actions">
                    ${!collection.is_favorite ? 
                        `<button class="btn btn-small btn-favorite" onclick="addToFavorite('${collection.id}')">
                            ⭐ 收藏
                        </button>` : 
                        `<span style="color: #28a745;">⭐ 已收藏</span>`
                    }
                </div>
            `;
            
            return card;
        }
        
        // 获取匹配类型文本
        function getMatchTypeText(type) {
            const types = {
                'exact': '精确匹配',
                'fuzzy': '模糊匹配',
                'text': '原文匹配'
            };
            return types[type] || type;
        }
        
        // 格式化日期
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            });
        }
        
        // 添加到收藏
        async function addToFavorite(collectionId) {
            try {
                const response = await fetch(
                    `${API_BASE_URL}/api/v1/weekly/favorites`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            user_id: currentUserId,
                            collection_id: collectionId,
                            keywords: ['示例关键词']
                        })
                    }
                );
                
                const data = await response.json();
                
                if (data.success) {
                    alert('收藏成功');
                    loadStatistics();
                } else {
                    alert('收藏失败：' + data.message);
                }
            } catch (error) {
                console.error('收藏失败:', error);
                alert('收藏失败，请稍后重试');
            }
        }
        
        // 显示加载提示
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }
        
        // 显示错误信息
        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = message;
            
            const content = document.querySelector('.content');
            content.insertBefore(errorDiv, content.firstChild);
            
            setTimeout(() => {
                errorDiv.remove();
            }, 5000);
        }
    </script>
</body>
</html>
