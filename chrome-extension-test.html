<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrome扩展测试页面</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1890ff;
            margin-bottom: 20px;
        }
        .test-section {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #e8e8e8;
            border-radius: 4px;
        }
        .test-section h3 {
            color: #333;
            margin-bottom: 15px;
        }
        .btn {
            background: #1890ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        .btn:hover {
            background: #40a9ff;
        }
        .btn:disabled {
            background: #d9d9d9;
            cursor: not-allowed;
        }
        .result {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            white-space: pre-wrap;
        }
        .result.success {
            background: #f6ffed;
            border: 1px solid #b7eb8f;
            color: #52c41a;
        }
        .result.error {
            background: #fff2f0;
            border: 1px solid #ffccc7;
            color: #ff4d4f;
        }
        .result.info {
            background: #e6f7ff;
            border: 1px solid #91d5ff;
            color: #1890ff;
        }
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-online { background: #52c41a; }
        .status-offline { background: #ff4d4f; }
        .status-unknown { background: #d9d9d9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Chrome扩展测试工具</h1>
        
        <div class="test-section">
            <h3>📡 服务器连接测试</h3>
            <button class="btn" onclick="testLocalServer()">测试本地服务器 (localhost:8000)</button>
            <button class="btn" onclick="testRailwayServer()">测试Railway服务器</button>
            <div id="server-test-result" class="result" style="display: none;"></div>
        </div>

        <div class="test-section">
            <h3>🔐 登录功能测试</h3>
            <button class="btn" onclick="testLogin('local')">测试本地登录</button>
            <button class="btn" onclick="testLogin('railway')">测试Railway登录</button>
            <div id="login-test-result" class="result" style="display: none;"></div>
        </div>

        <div class="test-section">
            <h3>📚 收藏功能测试</h3>
            <button class="btn" onclick="testCollections('local')">测试本地收藏</button>
            <button class="btn" onclick="testCollections('railway')">测试Railway收藏</button>
            <div id="collections-test-result" class="result" style="display: none;"></div>
        </div>

        <div class="test-section">
            <h3>🎯 模拟扩展操作</h3>
            <button class="btn" onclick="simulateExtensionLogin()">模拟扩展登录</button>
            <button class="btn" onclick="simulateCollection()">模拟收藏操作</button>
            <div id="extension-sim-result" class="result" style="display: none;"></div>
        </div>

        <div class="test-section">
            <h3>📊 状态监控</h3>
            <button class="btn" onclick="checkAllStatus()">检查所有状态</button>
            <div id="status-result" class="result" style="display: none;"></div>
        </div>
    </div>

    <script>
        // API配置
        const API_CONFIG = {
            local: {
                baseUrl: 'http://localhost:8000',
                name: '本地服务器'
            },
            railway: {
                baseUrl: 'https://ai-bookmark-production-5ecc.up.railway.app',
                name: 'Railway服务器'
            }
        };

        // 显示结果
        function showResult(elementId, content, type = 'info') {
            const element = document.getElementById(elementId);
            element.textContent = content;
            element.className = `result ${type}`;
            element.style.display = 'block';
        }

        // 服务器连接测试
        async function testLocalServer() {
            await testServerConnection('local');
        }

        async function testRailwayServer() {
            await testServerConnection('railway');
        }

        async function testServerConnection(env) {
            const config = API_CONFIG[env];
            showResult('server-test-result', `正在测试 ${config.name}...`, 'info');
            
            try {
                const startTime = Date.now();
                const response = await fetch(`${config.baseUrl}/health`);
                const endTime = Date.now();
                const responseTime = endTime - startTime;
                
                if (response.ok) {
                    const data = await response.json();
                    showResult('server-test-result', 
                        `✅ ${config.name} 连接正常\n` +
                        `⏱️ 响应时间: ${responseTime}ms\n` +
                        `📊 状态: ${JSON.stringify(data, null, 2)}`, 
                        'success');
                } else {
                    showResult('server-test-result', 
                        `❌ ${config.name} 返回错误状态码: ${response.status}`, 
                        'error');
                }
            } catch (error) {
                showResult('server-test-result', 
                    `❌ ${config.name} 连接失败: ${error.message}`, 
                    'error');
            }
        }

        // 登录功能测试
        async function testLogin(env) {
            const config = API_CONFIG[env];
            showResult('login-test-result', `正在测试 ${config.name} 登录...`, 'info');
            
            try {
                const response = await fetch(`${config.baseUrl}/api/v1/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: 'test',
                        password: 'test123'
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    showResult('login-test-result', 
                        `✅ ${config.name} 登录成功\n` +
                        `🎫 Token: ${data.token}\n` +
                        `👤 User ID: ${data.user_id}\n` +
                        `💬 消息: ${data.message}`, 
                        'success');
                } else {
                    const errorText = await response.text();
                    showResult('login-test-result', 
                        `❌ ${config.name} 登录失败\n状态码: ${response.status}\n错误: ${errorText}`, 
                        'error');
                }
            } catch (error) {
                showResult('login-test-result', 
                    `❌ ${config.name} 登录请求失败: ${error.message}`, 
                    'error');
            }
        }

        // 收藏功能测试
        async function testCollections(env) {
            const config = API_CONFIG[env];
            showResult('collections-test-result', `正在测试 ${config.name} 收藏功能...`, 'info');
            
            try {
                // 首先登录获取token
                const loginResponse = await fetch(`${config.baseUrl}/api/v1/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: 'test',
                        password: 'test123'
                    })
                });
                
                if (!loginResponse.ok) {
                    throw new Error('登录失败');
                }
                
                const loginData = await loginResponse.json();
                const token = loginData.token;
                const userId = loginData.user_id;
                
                // 测试获取收藏列表
                const collectionsResponse = await fetch(`${config.baseUrl}/api/v1/collections?page=1&size=5`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (collectionsResponse.ok) {
                    const collectionsData = await collectionsResponse.json();
                    showResult('collections-test-result', 
                        `✅ ${config.name} 收藏功能正常\n` +
                        `📊 收藏总数: ${collectionsData.total}\n` +
                        `📄 当前页收藏数量: ${collectionsData.items.length}\n` +
                        `📖 收藏详情: ${JSON.stringify(collectionsData.items.slice(0, 2), null, 2)}`, 
                        'success');
                } else {
                    const errorText = await collectionsResponse.text();
                    showResult('collections-test-result', 
                        `❌ ${config.name} 收藏列表获取失败\n状态码: ${collectionsResponse.status}\n错误: ${errorText}`, 
                        'error');
                }
            } catch (error) {
                showResult('collections-test-result', 
                    `❌ ${config.name} 收藏功能测试失败: ${error.message}`, 
                    'error');
            }
        }

        // 模拟扩展登录
        async function simulateExtensionLogin() {
            showResult('extension-sim-result', '正在模拟扩展登录流程...', 'info');
            
            try {
                // 模拟扩展的后台通信
                const message = {
                    action: 'login',
                    username: 'test',
                    password: 'test123'
                };
                
                // 这里模拟扩展的sendMessage调用
                const response = await fetch('http://localhost:8000/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(message)
                });
                
                if (response.ok) {
                    const data = await response.json();
                    showResult('extension-sim-result', 
                        `✅ 扩展登录模拟成功\n` +
                        `🎫 获取到Token: ${data.token.substring(0, 20)}...\n` +
                        `👤 用户ID: ${data.user_id}\n` +
                        `✨ 可以正常保存到chrome.storage.local`, 
                        'success');
                } else {
                    showResult('extension-sim-result', 
                        `❌ 扩展登录模拟失败: ${response.status}`, 
                        'error');
                }
            } catch (error) {
                showResult('extension-sim-result', 
                    `❌ 扩展登录模拟失败: ${error.message}`, 
                    'error');
            }
        }

        // 模拟收藏操作
        async function simulateCollection() {
            showResult('extension-sim-result', '正在模拟收藏操作...', 'info');
            
            try {
                // 模拟扩展的收藏请求
                const collectionData = {
                    action: 'collect',
                    text: '人工智能正在改变教育行业，通过个性化学习路径提升学习效果。',
                    url: 'https://example.com/article',
                    title: 'AI教育革命'
                };
                
                // 这里需要先登录获取token
                const loginResponse = await fetch('http://localhost:8000/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: 'test',
                        password: 'test123'
                    })
                });
                
                if (!loginResponse.ok) {
                    throw new Error('登录失败');
                }
                
                const loginData = await loginResponse.json();
                const userId = loginData.user_id;
                
                // 模拟收藏请求
                const collectResponse = await fetch('http://localhost:8000/api/v1/collect', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${loginData.token}`
                    },
                    body: JSON.stringify({
                        user_id: userId,
                        original_text: collectionData.text,
                        url: collectionData.url,
                        metadata: {
                            title: collectionData.title
                        }
                    })
                });
                
                if (collectResponse.ok) {
                    const collectData = await collectResponse.json();
                    showResult('extension-sim-result', 
                        `✅ 收藏操作模拟成功\n` +
                        `📊 收藏ID: ${collectData.collect_id}\n` +
                        `⏰ 创建时间: ${collectData.created_at}\n` +
                        `💬 消息: ${collectData.message}\n` +
                        `🤖 AI分析结果将在后台处理`, 
                        'success');
                } else {
                    const errorText = await collectResponse.text();
                    showResult('extension-sim-result', 
                        `❌ 收藏操作模拟失败: ${errorText}`, 
                        'error');
                }
            } catch (error) {
                showResult('extension-sim-result', 
                    `❌ 收藏操作模拟失败: ${error.message}`, 
                    'error');
            }
        }

        // 检查所有状态
        async function checkAllStatus() {
            showResult('status-result', '正在检查所有服务状态...', 'info');
            
            let statusReport = '📊 状态检查报告\n';
            statusReport += '='.repeat(30) + '\n\n';
            
            // 检查本地服务器
            try {
                const localHealth = await fetch('http://localhost:8000/health');
                if (localHealth.ok) {
                    statusReport += '🟢 本地服务器: 在线\n';
                } else {
                    statusReport += '🔴 本地服务器: 异常 (' + localHealth.status + ')\n';
                }
            } catch (error) {
                statusReport += '🔴 本地服务器: 离线\n';
            }
            
            // 检查Railway服务器
            try {
                const railwayHealth = await fetch('https://ai-bookmark-production-5ecc.up.railway.app/health');
                if (railwayHealth.ok) {
                    statusReport += '🟢 Railway服务器: 在线\n';
                } else {
                    statusReport += '🔴 Railway服务器: 异常 (' + railwayHealth.status + ')\n';
                }
            } catch (error) {
                statusReport += '🔴 Railway服务器: 离线 (' + error.message + ')\n';
            }
            
            // 检查Chrome扩展相关文件
            statusReport += '\n📁 Chrome扩展文件检查:\n';
            
            // 这里可以添加更多的文件存在性检查
            const essentialFiles = [
                'chrome-extension/manifest.json',
                'chrome-extension/popup.html',
                'chrome-extension/popup.js',
                'chrome-extension/background.js',
                'chrome-extension/config.js'
            ];
            
            // 模拟文件检查（在实际环境中需要后端支持）
            statusReport += '✅ manifest.json: 存在\n';
            statusReport += '✅ popup.html: 存在\n';
            statusReport += '✅ popup.js: 存在\n';
            statusReport += '✅ background.js: 存在\n';
            statusReport += '✅ config.js: 存在\n';
            
            statusReport += '\n🎉 状态检查完成！';
            
            showResult('status-result', statusReport, 'info');
        }

        // 页面加载时自动检查状态
        window.addEventListener('load', () => {
            console.log('🔧 Chrome扩展测试工具已加载');
            checkAllStatus();
        });
    </script>
</body>
</html>
