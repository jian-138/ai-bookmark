<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>周报收藏与搜索</title>
  <link rel="stylesheet" href="weekly-favorite.css">
</head>
<body>
  <div class="container">
    <!-- 头部 -->
    <div class="header">
      <div class="header-title">
        <button id="back-btn" class="back-btn" title="返回">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
          </svg>
        </button>
        <h2>📚 周报收藏</h2>
      </div>
      <div class="header-actions">
        <button id="refresh-btn" class="icon-btn" title="刷新">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- 统计信息 -->
    <div class="stats-section">
      <div class="stat-card">
        <div class="stat-number" id="total-keywords">0</div>
        <div class="stat-label">关键词</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="total-favorites">0</div>
        <div class="stat-label">收藏</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="total-collections">0</div>
        <div class="stat-label">内容</div>
      </div>
    </div>

    <!-- 搜索区域 -->
    <div class="search-section">
      <div class="search-box">
        <input 
          type="text" 
          id="search-input" 
          class="search-input" 
          placeholder="输入关键词搜索..."
        >
        <button id="search-btn" class="search-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
        </button>
      </div>
      
      <div class="search-options">
        <label class="checkbox-label">
          <input type="checkbox" id="exact-match">
          <span>精确匹配</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="favorites-only" checked>
          <span>只看收藏</span>
        </label>
      </div>
    </div>

    <!-- 关键词云 -->
    <div class="keyword-cloud-section">
      <h3>🔥 热门关键词</h3>
      <div id="keyword-cloud" class="keyword-cloud">
        <div class="loading-sm">加载中...</div>
      </div>
    </div>

    <!-- 搜索结果 -->
    <div class="results-section">
      <div class="results-header">
        <h3>📋 搜索结果</h3>
        <span id="result-count" class="result-count"></span>
      </div>
      <div id="search-results" class="search-results">
        <div class="empty-state">输入关键词开始搜索</div>
      </div>
    </div>

    <!-- 加载提示 -->
    <div id="loading" class="loading-overlay" style="display: none;">
      <div class="spinner"></div>
      <p>加载中...</p>
    </div>
  </div>

  <script src="weekly-favorite.js"></script>
</body>
</html>
