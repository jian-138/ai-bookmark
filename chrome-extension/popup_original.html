<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI书签收藏助手</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 320px;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: #333;
      background: #f5f5f5;
    }
    
    .page {
      padding: 20px;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .header h1 {
      font-size: 18px;
      color: #1890ff;
      margin-bottom: 5px;
    }
    
    .header h2 {
      font-size: 16px;
      color: #1890ff;
      margin-bottom: 10px;
    }
    
    .subtitle {
      color: #666;
      font-size: 12px;
    }
    
    .login-form {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .login-form input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      font-size: 14px;
    }
    
    .login-form input:focus {
      outline: none;
      border-color: #1890ff;
    }
    
    .btn {
      width: 100%;
      padding: 10px;
      background: #1890ff;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.3s;
    }
    
    .btn:hover {
      background: #40a9ff;
    }
    
    .btn:disabled {
      background: #d9d9d9;
      cursor: not-allowed;
    }
    
    .hint {
      text-align: center;
      color: #999;
      font-size: 12px;
      margin-top: 10px;
    }
    
    .error-msg {
      background: #fff2f0;
      border: 1px solid #ffccc7;
      color: #ff4d4f;
      padding: 8px;
      border-radius: 4px;
      margin-top: 10px;
      font-size: 12px;
      display: none;
    }
    
    .collections-list {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-height: 300px;
      overflow-y: auto;
    }
    
    .collection-item {
      padding: 12px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      transition: background 0.3s;
    }
    
    .collection-item:hover {
      background: #fafafa;
    }
    
    .collection-item:last-child {
      border-bottom: none;
    }
    
    .collection-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    
    .collection-category {
      background: #e6f7ff;
      color: #1890ff;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
    }
    
    .collection-time {
      color: #999;
      font-size: 11px;
    }
    
    .collection-content {
      color: #333;
      margin-bottom: 6px;
      line-height: 1.4;
      font-size: 13px;
    }
    
    .collection-url {
      margin-bottom: 6px;
    }
    
    .collection-url a {
      color: #1890ff;
      text-decoration: none;
      font-size: 11px;
      word-break: break-all;
    }
    
    .collection-url a:hover {
      text-decoration: underline;
    }
    
    .collection-keywords {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    
    .keyword-tag {
      background: #f0f0f0;
      color: #666;
      padding: 2px 4px;
      border-radius: 3px;
      font-size: 10px;
    }
    
    .header-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 10px;
    }
    
    .icon-btn {
      background: none;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      padding: 6px;
      cursor: pointer;
      transition: all 0.3s;
      color: #666;
      font-size: 12px;
    }
    
    .icon-btn:hover {
      border-color: #1890ff;
      color: #1890ff;
    }
    
    .footer {
      text-align: center;
      margin-top: 15px;
    }
    
    .footer-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 10px;
    }
    
    .secondary-btn {
      background: #52c41a;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.3s;
    }
    
    .secondary-btn:hover {
      background: #73d13d;
    }
    
    .stats {
      color: #999;
      font-size: 12px;
    }
    
    .loading {
      text-align: center;
      padding: 20px;
      color: #999;
    }
    
    .empty {
      text-align: center;
      padding: 20px;
      color: #999;
    }
    
    .error {
      background: #fff2f0;
      border: 1px solid #ffccc7;
      color: #ff4d4f;
      padding: 10px;
      border-radius: 4px;
      text-align: center;
      margin: 10px;
    }
  </style>
</head>
<body>
  <!-- 登录页面 -->
  <div id="login-page" class="page">
    <div class="header">
      <h1>📚 AI书签</h1>
      <p class="subtitle">智能收藏 · AI分析</p>
    </div>
    
    <div class="login-form">
      <input type="text" id="username" placeholder="用户名" value="test">
      <input type="password" id="password" placeholder="密码" value="test123">
      <button id="login-btn" class="btn">登录</button>
      <p class="hint">测试账号: test / test123</p>
    </div>
    
    <div id="login-error" class="error-msg" style="display: none;"></div>
  </div>
  
  <!-- 主页面 -->
  <div id="main-page" class="page" style="display: none;">
    <div class="header">
      <h2>我的收藏</h2>
      <div class="header-actions">
        <button id="sync-btn" class="icon-btn" title="同步离线收藏">🔄</button>
        <button id="logout-btn" class="icon-btn" title="退出登录">👋</button>
      </div>
    </div>
    
    <div id="collections-list" class="collections-list">
      <div class="loading">加载中...</div>
    </div>
    
    <div class="footer">
      <div class="footer-actions">
        <button id="weekly-report-btn" class="secondary-btn">📊 周报</button>
      </div>
      <p class="stats">
        <span id="total-count">0</span> 条收藏
        <span id="offline-count" style="display: none;"> · <span id="offline-num">0</span> 条待同步</span>
      </p>
    </div>
  </div>

  <script src="popup_original.js"></script>
</body>
</html>
