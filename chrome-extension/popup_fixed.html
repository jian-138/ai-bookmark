// popup.html - 修复版弹出页面
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI书签收藏助手</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 350px;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: #333;
      background: #f5f5f5;
    }
    
    .page {
      padding: 20px;
    }
    
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    
    .header h1 {
      font-size: 20px;
      color: #1890ff;
      margin-bottom: 5px;
    }
    
    .header h2 {
      font-size: 18px;
      color: #1890ff;
      margin-bottom: 10px;
    }
    
    .subtitle {
      color: #666;
      font-size: 12px;
    }
    
    .login-form {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .login-form input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      font-size: 14px;
    }
    
    .login-form input:focus {
      outline: none;
      border-color: #1890ff;
    }
    
    .primary-btn {
      width: 100%;
      padding: 12px;
      background: #1890ff;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.3s;
    }
    
    .primary-btn:hover {
      background: #40a9ff;
    }
    
    .primary-btn:disabled {
      background: #d9d9d9;
      cursor: not-allowed;
    }
    
    .hint {
      text-align: center;
      color: #999;
      font-size: 12px;
      margin-top: 10px;
    }
    
    .error-msg {
      background: #fff2f0;
      border: 1px solid #ffccc7;
      color: #ff4d4f;
      padding: 10px;
      border-radius: 4px;
      margin-top: 10px;
      font-size: 12px;
      display: none;
    }
    
    .collections-list {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-height: 300px;
      overflow-y: auto;
    }
    
    .collection-item {
      padding: 15px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      transition: background 0.3s;
    }
    
    .collection-item:hover {
      background: #fafafa;
    }
    
    .collection-item:last-child {
      border-bottom: none;
    }
    
    .collection-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    
    .collection-category {
      background: #e6f7ff;
      color: #1890ff;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
    
    .collection-time {
      color: #999;
      font-size: 12px;
    }
    
    .collection-content {
      color: #333;
      margin-bottom: 8px;
      line-height: 1.4;
    }
    
    .collection-url {
      margin-bottom: 8px;
    }
    
    .collection-url a {
      color: #1890ff;
      text-decoration: none;
      font-size: 12px;
      word-break: break-all;
    }
    
    .collection-url a:hover {
      text-decoration: underline;
    }
    
    .collection-keywords {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    
    .keyword-tag {
      background: #f0f0f0;
      color: #666;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
    }
    
    .header-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 10px;
    }
    
    .icon-btn {
      background: none;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      padding: 8px;
      cursor: pointer;
      transition: all 0.3s;
      color: #666;
    }
    
    .icon-btn:hover {
      border-color: #1890ff;
      color: #1890ff;
    }
    
    .icon-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .footer {
      text-align: center;
      margin-top: 15px;
    }
    
    .footer-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 10px;
    }
    
    .weekly-report-btn {
      background: #52c41a;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.3s;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .weekly-report-btn:hover {
      background: #73d13d;
    }
    
    .stats {
      color: #999;
      font-size: 12px;
    }
    
    .loading {
      text-align: center;
      padding: 40px;
      color: #999;
    }
    
    .empty {
      text-align: center;
      padding: 40px;
      color: #999;
    }
    
    .error {
      background: #fff2f0;
      border: 1px solid #ffccc7;
      color: #ff4d4f;
      padding: 15px;
      border-radius: 4px;
      text-align: center;
      margin: 20px;
    }
    
    .back-btn {
      background: none;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      padding: 8px;
      cursor: pointer;
      transition: all 0.3s;
      color: #666;
      margin-right: 10px;
    }
    
    .back-btn:hover {
      border-color: #1890ff;
      color: #1890ff;
    }
    
    .header-title {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .search-section {
      background: white;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    
    .search-input {
      flex: 1;
      padding: 10px;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      font-size: 14px;
    }
    
    .search-input:focus {
      outline: none;
      border-color: #1890ff;
    }
    
    .search-btn {
      background: #1890ff;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 10px 15px;
      cursor: pointer;
      transition: background 0.3s;
    }
    
    .search-btn:hover {
      background: #40a9ff;
    }
    
    .search-options {
      display: flex;
      gap: 15px;
      font-size: 12px;
    }
    
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }
    
    .search-results-container {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 15px;
    }
    
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      border-bottom: 1px solid #f0f0f0;
    }
    
    .result-count {
      color: #999;
      font-size: 12px;
    }
    
    .results-list {
      max-height: 200px;
      overflow-y: auto;
    }
    
    .search-result-item {
      padding: 15px;
      border-bottom: 1px solid #f0f0f0;
    }
    
    .search-result-item:last-child {
      border-bottom: none;
    }
    
    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    
    .result-category {
      background: #e6f7ff;
      color: #1890ff;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
    
    .result-time {
      color: #999;
      font-size: 12px;
    }
    
    .result-content {
      color: #333;
      margin-bottom: 8px;
      line-height: 1.4;
    }
    
    .result-url {
      margin-bottom: 8px;
    }
    
    .result-url a {
      color: #1890ff;
      text-decoration: none;
      font-size: 12px;
      word-break: break-all;
    }
    
    .result-url a:hover {
      text-decoration: underline;
    }
    
    .result-keywords {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    
    .weekly-reports-container {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 20px;
    }
    
    .weekly-report-card {
      border: 1px solid #f0f0f0;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 15px;
    }
    
    .report-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #f0f0f0;
    }
    
    .report-time {
      color: #999;
      font-size: 12px;
    }
    
    .report-summary {
      margin-bottom: 15px;
      line-height: 1.6;
    }
    
    .report-stats {
      display: flex;
      gap: 20px;
      margin-bottom: 15px;
    }
    
    .stat-item {
      text-align: center;
    }
    
    .stat-value {
      display: block;
      font-size: 24px;
      font-weight: bold;
      color: #1890ff;
    }
    
    .stat-label {
      font-size: 12px;
      color: #999;
    }
    
    .report-section {
      margin-bottom: 15px;
    }
    
    .report-section h4 {
      margin-bottom: 10px;
      color: #333;
    }
    
    .keyword-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    
    .category-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    
    .category-badge {
      background: #f0f0f0;
      color: #666;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
    }
    
    .report-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      border-top: 1px solid #f0f0f0;
      font-size: 12px;
      color: #999;
    }
    
    .retry-btn {
      background: #ff4d4f;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 12px;
      margin-top: 10px;
    }
    
    .retry-btn:hover {
      background: #ff7875;
    }
    
    #offline-count {
      color: #ff4d4f;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <!-- 登录页面 -->
  <div id="login-page" class="page">
    <div class="header">
      <h1>📚 AI书签</h1>
      <p class="subtitle">智能收藏 · AI分析</p>
    </div>
    
    <div class="login-form">
      <input type="text" id="username" placeholder="用户名" value="test">
      <input type="password" id="password" placeholder="密码" value="test123">
      <button id="login-btn" class="primary-btn">登录</button>
      <p class="hint">测试账号: test / test123</p>
    </div>
    
    <div id="login-error" class="error-msg" style="display: none;"></div>
  </div>
  
  <!-- 主页面 -->
  <div id="main-page" class="page" style="display: none;">
    <div class="header">
      <h2>我的收藏</h2>
      <div class="header-actions">
        <button id="sync-btn" class="icon-btn" title="同步离线收藏">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.57 8 7.99 8v3l4-4-4-4v3z"/>
          </svg>
        </button>
        <button id="logout-btn" class="icon-btn" title="退出登录">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
          </svg>
        </button>
      </div>
    </div>
    
    <div id="collections-list" class="collections-list">
      <div class="loading">加载中...</div>
    </div>
    
    <div class="footer">
      <div class="footer-actions">
        <button id="weekly-favorite-btn" class="weekly-report-btn" title="周报收藏与搜索">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
          搜索
        </button>
        <button id="weekly-report-btn" class="weekly-report-btn" title="查看周报">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
          </svg>
          周报
        </button>
      </div>
      <p class="stats">
        <span id="total-count">0</span> 条收藏
        <span id="offline-count" style="display: none;"> · <span id="offline-num">0</span> 条待同步</span>
      </p>
    </div>
  </div>
  
  <!-- 周报页面 -->
  <div id="weekly-report-page" class="page" style="display: none;">
    <div class="header">
      <div class="header-title">
        <button id="back-to-main" class="back-btn" title="返回主页面">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
          </svg>
        </button>
        <h2>📊 我的周报</h2>
      </div>
      <div class="header-actions">
        <button id="generate-report-btn" class="icon-btn" title="生成本周周报">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          </svg>
        </button>
      </div>
    </div>
    
    <!-- 搜索区域 - 直接集成在周报页面中 -->
    <div class="search-section">
      <div class="search-box">
        <input type="text" id="weekly-search-input" class="search-input" placeholder="输入关键词搜索收藏内容...">
        <button id="weekly-search-btn" class="search-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
        </button>
      </div>
      
      <div class="search-options">
        <label class="checkbox-label">
          <input type="checkbox" id="weekly-exact-match">
          <span>精确匹配</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="weekly-favorites-only" checked>
          <span>只看收藏</span>
        </label>
      </div>
    </div>
    
    <!-- 搜索结果区域 -->
    <div id="weekly-search-results" class="search-results-container" style="display: none;">
      <div class="results-header">
        <h3>🔍 搜索结果</h3>
        <span id="weekly-result-count" class="result-count"></span>
      </div>
      <div id="weekly-results-list" class="results-list">
        <!-- 搜索结果将动态加载到这里 -->
      </div>
    </div>
    
    <div id="weekly-reports-container" class="weekly-reports-container">
      <!-- 周报内容将动态加载到这里 -->
    </div>
  </div>

  <script src="popup_fixed.js"></script>
</body>
</html>
